name: Release

# On main: opens (or updates) a "chore: version packages" PR from pending changesets.
# Merging that PR publishes the bumped packages to npm with npm Trusted Publishing (GitHub OIDC):
# no token secret, and every version gets a provenance statement. The first version of each
# package is published once by hand (`pnpm release`), then a trusted publisher pointing at this
# workflow is added on npmjs.com.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance
  packages: write # the Docker image on GitHub Container Registry

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm 11.5+, needed for Trusted Publishing
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Published @towhee/node version
        id: node
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: echo "version=$(node -e 'const p=JSON.parse(process.env.PUBLISHED).find(p=>p.name==="@towhee/node");process.stdout.write(p?p.version:"")')" >> "$GITHUB_OUTPUT"
    outputs:
      node-version: ${{ steps.node.outputs.version }}

  # When @towhee/node publishes, the same version goes out as ghcr.io/tobibytes/towhee (amd64 and arm64).
  docker:
    needs: release
    if: needs.release.outputs.node-version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tobibytes/towhee:${{ needs.release.outputs.node-version }}
            ghcr.io/tobibytes/towhee:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tobibytes/towhee
            org.opencontainers.image.version=${{ needs.release.outputs.node-version }}
            org.opencontainers.image.licenses=MIT
