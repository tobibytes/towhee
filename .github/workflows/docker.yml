name: Docker image

# Pushes ghcr.io/tobibytes/towhee by hand: for the first release (published locally, so the
# Release workflow didn't build it) or to rebuild a version. Run it from the commit that was released.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag, like 0.1.0 (also tagged latest)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/tobibytes/towhee:${{ inputs.version }}
            ghcr.io/tobibytes/towhee:latest
          labels: |
            org.opencontainers.image.source=https://github.com/tobibytes/towhee
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
